<div class="manage-partners-container">
  <div class="header d-flex justify-content-between align-items-center mb-2">
    <h2>Manage Partners</h2>
    <button (click)="openForm()" class="btn btn-success btn-sm">+ Add New Partner</button>
  </div>

  @if (successMessage) {
    <div class="alert alert-success">
      {{ successMessage }}
    </div>
  }

  @if (errorMessage) {
    <div class="alert alert-danger">
      {{ errorMessage }}
    </div>
  }

  <app-manage-network-partners-list
    [partners]="partners"
    [isLoading]="isLoading"
    (edit)="onEditPartner($event)"
  ></app-manage-network-partners-list>

  <app-manage-network-partners-form
    [isVisible]="isFormVisible"
    [editingPartner]="editingPartner"
    (save)="onSavePartner($event)"
    (close)="closeForm()"
  ></app-manage-network-partners-form>
</div>
