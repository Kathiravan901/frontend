<div class="add-order">
  <h2>Place New Order</h2>
  <form [formGroup]="orderForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-group">
        <label for="orderType">Order Type:</label>
        <select id="orderType" formControlName="orderType" required>
          <option value="PO" [disabled]="isOrderTypeDisabled('PO')">Purchase Order</option>
          <option value="SO" [disabled]="isOrderTypeDisabled('SO')">Sales Order</option>
          <option value="Transfer" [disabled]="isOrderTypeDisabled('Transfer')">Transfer</option>
        </select>
      </div>
      <div class="form-group">
        <label for="partnerId">Partner:</label>
        <select id="partnerId" formControlName="partnerId">
          <option value="">Select Partner</option>
          @for (partner of filteredPartners; track partner.partnerId) {
            <option [value]="partner.partnerId">{{ partner.partnerName }}</option>
          }
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="originLocationId">Origin Location:</label>
        <select id="originLocationId" formControlName="originLocationId">
          <option value="">Select Origin</option>
          @for (location of locations; track location.locationId) {
            <option [value]="location.locationId">{{ location.name }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label for="destinationLocationId">Destination Location:</label>
        <select id="destinationLocationId" formControlName="destinationLocationId">
          <option value="">Select Destination</option>
          @for (location of locations; track location.locationId) {
            <option [value]="location.locationId">{{ location.name }}</option>
          }
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="orderDate">Order Date:</label>
        <input type="date" id="orderDate" formControlName="orderDate" required>
      </div>
      <div class="form-group">
        <label for="expectedDeliveryDate">Expected Delivery Date:</label>
        <input type="date" id="expectedDeliveryDate" formControlName="expectedDeliveryDate">
      </div>
    </div>

    <h3>Order Lines</h3>
    <div formArrayName="lines">
      @for (line of orderLines.controls; let i = $index; track i) {
        <div [formGroupName]="i" class="order-line">
          <div class="form-row">
            <div class="form-group">
              <label>Item:</label>
              <select formControlName="itemId" required>
                <option value="">Select Item</option>
                @for (item of items; track item.itemId) {
                  <option [value]="item.itemId">{{ item.itemName }}</option>
                }
              </select>
            </div>
            <div class="form-group">
              <label>Quantity:</label>
              <input type="number" formControlName="qtyOrdered" min="1" required>
            </div>
            <div class="form-group">
              <label>Unit Price:</label>
              <input type="number" formControlName="unitPrice" min="0" step="0.01" required>
            </div>
            @if (orderLines.length > 1) {
              <button type="button" class="btn-remove-line" (click)="removeOrderLine(i)">Remove</button>
            }
          </div>
        </div>
      }
    </div>
    <button type="button" class="btn-add-line" (click)="addOrderLine()">Add Line</button>

    <div class="form-actions">
      <button type="submit" class="btn-submit" [disabled]="orderForm.invalid || isSubmitting">Place Order</button>
    </div>
  </form>
  @if (successMessage) {
    <div class="success">{{ successMessage }}</div>
  }
  @if (errorMessage) {
    <div class="error">{{ errorMessage }}</div>
  }
</div>
